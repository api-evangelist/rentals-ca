name: Rentals.ca
kind: company
description: >-
  Rentals.ca is a Toronto-headquartered residential rental marketplace and
  the flagship brand of the Rentals.ca Network, which also operates Rentfaster.ca,
  Louer.ca, Rentboard.ca, RentCanada.com and TorontoRentals.com across more than 100
  Canadian cities. The network is owned and operated by Rentsync (formerly Landlord
  Web Solutions Inc.), which also acquired the research firm Urbanation in January
  2026 and co-publishes the monthly Rentals.ca / Urbanation National Rent Report;
  Rentals.ca listing data also feeds a Statistics Canada rental housing index. In
  the Canadian real estate value chain it sits on the rentals side of the market,
  outside CREA's REALTOR.ca and Data Distribution Facility, which syndicate member
  boards' for-sale listings. Its API posture is honest but closed: rentals.ca itself
  publishes no developer portal, no OpenAPI, and no documented public endpoint, and
  the entire consumer site sits behind a Cloudflare managed challenge that returns
  HTTP 403 to anonymous clients. The real developer surface belongs to the parent,
  at the Rentsync Partners portal (partners.rentsync.ca, branded "LIFT System API"),
  which publicly names a REST API, an Ad Syndication API and a Search API but places
  all documentation behind an account whose registration form requires a written
  application explaining what you intend to build. There is no RESO Web API or Data
  Dictionary certification, no OData $metadata document, no Universal Property
  Identifier, and no open dataset published by the company.
