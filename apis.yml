apis:
- aid: rentals-ca:rentsync-partners-rest-api
  name: Rentsync Partners REST API
  description: REST API described on the public Rentsync Partners portal (branded
    "LIFT System API") as giving partners "access to the underlying data structures
    of the LIFT System" with "detailed Canadian rental information". This is the API
    layer behind the Rentals.ca Network's rental listing data. Documentation is not
    public — https://partners.rentsync.ca/documentation returns HTTP 302 to
    /users/sign_in — and no base URL, endpoint list, or authentication scheme is
    disclosed anonymously. Access requires registering and submitting a written
    application describing what you plan to build.
  humanURL: https://partners.rentsync.ca/
  tags:
  - Rentals
  - Property Listings
  - Canada
  properties:
  - type: Portal
    url: https://partners.rentsync.ca/
  - type: Signup
    url: https://partners.rentsync.ca/users/sign_up
  - type: Login
    url: https://partners.rentsync.ca/users/sign_in
- aid: rentals-ca:rentsync-ad-syndication-api
  name: Rentsync Ad Syndication API
  description: Ad syndication API described on the public Rentsync Partners portal
    as programming interfaces used to "interact with rental industry professionals
    using Rentsync's Ad Syndication to manage their online advertising". This is the
    machine interface to the listing-distribution business that pushes property
    advertising into the Rentals.ca Network and partner portals. Documentation sits
    behind the same approved-account gate; no base URL, feed schema, or auth model
    is published anonymously.
  humanURL: https://partners.rentsync.ca/
  tags:
  - Listing Syndication
  - Advertising
  - Rentals
  properties:
  - type: Portal
    url: https://partners.rentsync.ca/
  - type: Signup
    url: https://partners.rentsync.ca/users/sign_up
- aid: rentals-ca:rentsync-search-api
  name: Rentsync Search API
  description: Search API described on the public Rentsync Partners portal as a way
    to "query the LIFT platform for specific information", positioned by the vendor
    as "a great way to get data for mapping applications" — the geospatial and query
    surface over Canadian rental listings. Documentation is gated behind an approved
    partner account; no base URL, query grammar, or rate limits are published
    anonymously.
  humanURL: https://partners.rentsync.ca/
  tags:
  - Search
  - Geospatial
  - Rentals
  properties:
  - type: Portal
    url: https://partners.rentsync.ca/
  - type: Signup
    url: https://partners.rentsync.ca/users/sign_up
